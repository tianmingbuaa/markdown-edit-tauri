name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-22.04
    env:
      # linuxdeploy runs as an AppImage inside CI; this avoids needing FUSE at runtime.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build AppImage and deb bundles
        run: npm run tauri build -- --bundles appimage,deb --ci

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build NSIS and MSI installers
        run: npm run tauri build -- --bundles nsis,msi --ci

      - name: Package portable build
        shell: pwsh
        run: |
          $config = Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json
          $version = $config.version
          $portableDir = Join-Path $PWD "portable"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null

          Copy-Item "src-tauri/target/release/mojian.exe" (Join-Path $portableDir "Mojian.exe")

          $readme = @'
          Mojian __VERSION__ - portable build

          - Double-click Mojian.exe to run. No installation is required.
          - Requires the Microsoft Edge WebView2 Runtime. Windows 10 21H2+ and
            Windows 11 include it by default. If it is missing, install it from:
            https://developer.microsoft.com/microsoft-edge/webview2/
          - Application data (settings and recent-note history) is stored in the
            system application data directory, not next to this executable.
          '@
          $readme = $readme -replace "__VERSION__", $version
          Set-Content -Path (Join-Path $portableDir "README.txt") -Value $readme -Encoding utf8

          $zipName = "Mojian_${version}_x64_portable.zip"
          Compress-Archive -Path (Join-Path $portableDir "*") -DestinationPath $zipName -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            Mojian_*_x64_portable.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-linux
      - build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Flatten artifacts
        run: |
          mkdir -p release-assets
          find dist -type f -exec cp -v {} release-assets/ \;
          ls -lh release-assets

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
